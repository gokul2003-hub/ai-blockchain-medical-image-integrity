version: '3.8'

# APP_ENV is required and never defaulted. Docker Compose reads these values from
# the .env file (see .env.example), so set APP_ENV=development there for local
# work. Setting APP_ENV=production makes the API and worker fail closed on any
# missing or development-grade secret, so there is no path from this file into a
# production deployment that silently inherits development values.

services:
  db:
    image: postgres:15-alpine
    container_name: medchain_db
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER must be set}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set - no default database credential is provided}
      POSTGRES_DB: ${DB_NAME:-medical_sharing}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - medchain_network

  redis:
    image: redis:7-alpine
    container_name: medchain_redis
    ports:
      - "6379:6379"
    networks:
      - medchain_network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medchain_api
    environment:
      - APP_ENV=${APP_ENV:?APP_ENV must be set explicitly to development, test, or production}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set explicitly}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set explicitly}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set explicitly}
      - MASTER_KEY=${MASTER_KEY:?MASTER_KEY must be set explicitly}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - BLOCKCHAIN_PROVIDER=${BLOCKCHAIN_PROVIDER:-development}
      - MFA_TEST_MODE=${MFA_TEST_MODE:-false}
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/code
    networks:
      - medchain_network

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medchain_celery
    command: celery -A app.celery_worker.celery_app worker --loglevel=info
    environment:
      - APP_ENV=${APP_ENV:?APP_ENV must be set explicitly to development, test, or production}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set explicitly}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set explicitly}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set explicitly}
      - MASTER_KEY=${MASTER_KEY:?MASTER_KEY must be set explicitly}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - BLOCKCHAIN_PROVIDER=${BLOCKCHAIN_PROVIDER:-development}
    depends_on:
      - db
      - redis
      - api
    volumes:
      - ./backend:/code
    networks:
      - medchain_network

  frontend:
    image: node:20-alpine
    container_name: medchain_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - api
    networks:
      - medchain_network

networks:
  medchain_network:
    driver: bridge

volumes:
  postgres_data:
